<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline — STUDIQS® SmartParent™</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
      display: inline-block;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-block;
      width: 100%;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
      text-decoration: none;
    }
    .retry-btn:hover { background: var(--primary-hover); }
    .security-note {
      margin-top: 16px;
      font-size: 11px;
      color: var(--muted);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon">📶⚡</div>
    <h1>You are Currently Offline</h1>
    <p>
      STUDIQS® SmartParent™ requires an active internet connection to securely fetch real-time student diagnostic telemetry and reports.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">Check Connection & Retry</button>
    <div class="security-note">
      🔒 Protected by Zero-Cache Student Privacy Protocols (DPDP Act 2023)
    </div>
  </div>
</body>
</html>
