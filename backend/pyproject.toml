[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartparent-backend"
version = "6.3.0"
description = "STUDIQS® SmartParent™ - High-Concurrency B2C Family Intelligence & Academic Telemetry Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Studiqs AI Core Team", email = "engineering@studiqs.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --tb=short"
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "strict"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::requests.RequestsDependencyWarning",
]

[tool.coverage.run]
source = ["src/smartparent"]
omit = [
    "tests/*",
    "alembic/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line too long
    "E712",  # Avoid equality comparisons to True (Standard in SQLAlchemy binary expressions)
    "E711",  # Avoid equality comparisons to None (Standard in SQLAlchemy)
    "E402",  # Module level import not at top of file
    "E401",  # Multiple imports on one line
    "E701",  # Multiple statements on one line
    "E722",  # Bare except
    "E741",  # Ambiguous variable name
    "F401",  # Unused imports (common in package __init__.py re-exports)
    "F403",  # Star import used
    "F405",  # Undefined name from star import
    "F841",  # Local variable assigned but never used
    "F541",  # f-string without placeholders
    "W291",  # Trailing whitespace
    "W292",  # No newline at end of file
    "W293",  # Blank line contains whitespace
]
