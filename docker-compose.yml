# ==============================================================================
# STUDIQS® SmartParent™ - Root Workspace Docker Compose Redirect
# Delegates to backend build context and services
# ==============================================================================

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartparent_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - RUN_MIGRATIONS=true
      - SEED_CURRICULUM=true
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/smartparent_db
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/smartparent_db
    volumes:
      - smartparent_uploads:/app/uploads
      - smartparent_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartparent_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartparent_celery_worker
    restart: always
    command: ["celery", "-A", "src.smartparent.core.celery_app", "worker", "-l", "info", "-Q", "evidence_queue,scheduled_queue", "-c", "4"]
    env_file:
      - ./backend/.env.example
    environment:
      - RUN_MIGRATIONS=false
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/smartparent_db
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/smartparent_db
    volumes:
      - smartparent_uploads:/app/uploads
      - smartparent_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - smartparent_net

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartparent_celery_beat
    restart: always
    command: ["celery", "-A", "src.smartparent.core.celery_app", "beat", "-l", "info"]
    env_file:
      - ./backend/.env.example
    environment:
      - RUN_MIGRATIONS=false
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/smartparent_db
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/smartparent_db
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - smartparent_net

  redis:
    image: redis:7-alpine
    container_name: smartparent_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smartparent_net

  postgres:
    image: postgres:16-alpine
    container_name: smartparent_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartparent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartparent_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartparent_net

volumes:
  smartparent_uploads:
    driver: local
  smartparent_storage:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  smartparent_net:
    driver: bridge
